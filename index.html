<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Конторка">
  <title>Конторка</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #d8e6d8;
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    :root { --noise: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxODAnIGhlaWdodD0nMTgwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjxmZUNvbG9yTWF0cml4IHR5cGU9J3NhdHVyYXRlJyB2YWx1ZXM9JzAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4="); }
    #app { position: fixed; inset: 0; overflow: hidden; }

    /* Размытая копия фото на весь экран: заполняет поля, если окно шире кадра */
    .backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(18px) brightness(0.55);
      transform: scale(1.1);
      pointer-events: none;
    }

    /* ---------- сцена 16:9, все слои в процентах ---------- */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      /* Кадр 16:9 занимает всю ширину окна. Если окно шире, лишнее обрезается
         сверху и снизу, но не больше ~9% высоты (195 вместо 177.78). */
      width: min(100vw, 195vh);
      width: min(100vw, 195dvh);
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      container-type: inline-size;
      background: #000;
    }
    .desk-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    .layer { position: absolute; box-sizing: border-box; }
    .desk-photo { filter: saturate(0.8) contrast(1.1) brightness(0.92); }

    /* ---------- атмосфера стола: слои поверх фото, координаты в % сцены ---------- */
    .fx { position: absolute; pointer-events: none; }
    .fx-grade { inset: 0; background: rgba(8, 34, 30, 0.34); mix-blend-mode: color; }
    .fx-window {
      left: 0; top: 0; width: 13%; height: 38%;
      overflow: hidden;
      background: linear-gradient(100deg, rgba(70, 120, 255, 0.30), transparent 85%);
      mix-blend-mode: screen;
      animation: fx-window 13s linear infinite;
    }
    .fx-window__pass {
      position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.85), transparent);
      animation: fx-pass 17s linear infinite;
    }
    @keyframes fx-window {
      0%, 100% { opacity: 0.85; } 40% { opacity: 1; } 41% { opacity: 0.35; } 42% { opacity: 1; } 70% { opacity: 0.7; }
    }
    @keyframes fx-pass {
      0%, 88% { transform: translateX(-130%); } 100% { transform: translateX(260%); }
    }
    .fx-spill {
      --spill: 0.5;
      left: 18%; top: 70%; width: 64%; height: 30%;
      background: radial-gradient(ellipse at 50% 0%, rgba(120, 255, 170, 0.2), transparent 70%);
      mix-blend-mode: screen;
      animation: fx-spill 6s linear infinite;
    }
    .stage.is-cam .fx-spill { --spill: 1; }
    @keyframes fx-spill {
      0%, 100% { opacity: var(--spill); }
      30% { opacity: calc(var(--spill) * 0.75); }
      32% { opacity: var(--spill); }
      66% { opacity: calc(var(--spill) * 0.85); }
    }
    .fx-vignette {
      inset: 0;
      background: radial-gradient(ellipse at 50% 45%, transparent 36%, rgba(0, 0, 0, calc(0.5 + 0.4 * var(--tension, 0))) 100%);
      animation: fx-breathe 9s ease-in-out infinite alternate;
    }
    @keyframes fx-breathe { from { opacity: 0.8; } to { opacity: 1; } }
    .fx-led {                                   /* индикатор веб-камеры над мониторами */
      left: 51.44%; top: 12.43%;
      width: 0.5cqw; height: 0.5cqw; margin: -0.25cqw 0 0 -0.25cqw;
      border-radius: 50%;
      background: #ff2a2a;
      box-shadow: 0 0 0.8cqw 0.25cqw rgba(255, 40, 40, 0.65);
      animation: fx-led 3.4s ease-in-out infinite;
    }
    @keyframes fx-led { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .fx-grain {
      inset: -10%;
      background-image: var(--noise);
      opacity: 0.06;
      mix-blend-mode: screen;
      animation: fx-grain 0.9s steps(6) infinite;
    }
    @keyframes fx-grain {
      0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); } 40% { transform: translate(2%, -3%); }
      60% { transform: translate(-2%, -1%); } 80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fx, .fx-window__pass { animation: none; }
    }

    /* Часы Sony: SVG в координатах фото (1672x941), цифры рисуются сегментами */
    .clock-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .clock-svg .seg { fill: #14b014; }

    /* ---------- мониторы ----------
       Каждый монитор это холст 640x376 px, который JS (desk.js) растягивает матрицей
       matrix3d на четырёхугольник экрана с фото. Внутри холста всё в обычных px. */
    .mon {
      position: absolute;
      left: 0;
      top: 0;
      width: 640px;
      height: 376px;
      transform-origin: 0 0;
      overflow: hidden;
      background: #040504;
      color: #ececec;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      visibility: hidden;            /* показывается после расчёта перспективы */
    }
    .mon.is-ready { visibility: visible; }
    .mon::before {                   /* статический шум, как на мониторах охраны */
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      background-image: var(--noise);
      opacity: 0.12;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .mon::after {                    /* строки развёртки и виньетка */
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
    }
    .glitch-silhouette { position: absolute; inset: 0; z-index: 7; overflow: hidden; pointer-events: none;
      background: radial-gradient(ellipse at 50% 77%, rgba(0, 0, 0, 0.94) 0 15%, transparent 16%);
      animation: glitch-silhouette 0.12s steps(2) infinite; }
    .glitch-silhouette[hidden] { display: none; }
    .glitch-silhouette span { position: absolute; left: 44%; top: 17%; width: 12%; height: 25%; border-radius: 50%;
      background: #020302; box-shadow: 0 18px 22px 10px #020302; }
    @keyframes glitch-silhouette { 50% { opacity: 0.65; transform: translateX(2px); } }
    @media (prefers-reduced-motion: reduce) { .glitch-silhouette { animation: none; } }

    /* ---------- отключение при 0% токенов (оверлей внутри каждого монитора) ---------- */
    .sd { position: absolute; inset: 0; z-index: 4; background: #000; pointer-events: auto; overflow: hidden;
      display: flex; align-items: center; justify-content: center; }
    .sd[hidden] { display: none; }
    .sd > * { display: none; }
    .sd[data-phase="error"], .sd[data-phase="glitch"] { background: #0b0202; }
    .sd[data-phase="glitch"] { animation: sd-flick 0.2s steps(1) infinite; }
    .sd[data-phase="error"] .sd-err, .sd[data-phase="glitch"] .sd-err { display: block; }
    .sd-err { width: 440px; box-sizing: border-box; padding: 18px 22px; border: 2px solid #ff4040; background: #120404; }
    .sd[data-phase="error"] .sd-err { animation: sd-in 0.4s steps(4) 1; }
    .sd[data-phase="glitch"] .sd-err { animation: sd-shake 0.3s steps(1) infinite;
      text-shadow: 2px 0 #00e5ff, -2px 0 #ff0030; }
    .sd-err__title { color: #ff4040; font-size: 18px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 10px; }
    .sd-err__text { color: #ececec; font-size: 14px; line-height: 1.4; }
    .sd-err__code { color: #888; font-size: 12px; margin-top: 12px; }
    .sd[data-phase="off"] .sd-line { display: block; position: absolute; left: 0; right: 0; top: 50%; height: 3px;
      margin-top: -1.5px; background: #fff; box-shadow: 0 0 12px 3px rgba(190, 255, 200, 0.8);
      animation: sd-collapse 0.6s ease-in forwards; }
    .sd[data-phase="boot"] .sd-boot, .sd[data-phase="fail"] .sd-boot { display: block; width: 320px; text-align: center; }
    .sd-boot__title { color: #ececec; font-size: 16px; letter-spacing: 0.06em; margin-bottom: 14px; }
    .sd-bar { height: 14px; box-sizing: border-box; border: 2px solid #ececec; padding: 2px; }
    .sd-bar i { display: block; height: 100%; width: 0; background: #ececec; }
    .sd[data-phase="fail"] .sd-bar { border-color: #ff4040; }
    .sd[data-phase="fail"] .sd-bar i { background: #ff3030; }
    .sd-boot__fail { display: none; color: #ff4040; font-size: 14px; font-weight: 700; margin-top: 14px; }
    .sd[data-phase="fail"] .sd-boot__fail { display: block; }
    .mon.is-dead::before, .mon.is-dead::after { display: none; }
    .stage.is-dark .fx-spill { animation: none; opacity: 0; transition: opacity 1.5s; }
    .stage.is-dark .desk-photo { filter: saturate(0.7) contrast(1.1) brightness(0.6); transition: filter 2s; }
    @keyframes sd-in { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0.3; } 100% { opacity: 1; } }
    @keyframes sd-flick {
      0% { background: #0b0202; } 20% { background: #3a0000; } 40% { background: #000; }
      55% { background: #0b0202; } 70% { background: #1a1a1a; } 85% { background: #000; }
    }
    @keyframes sd-shake {
      0% { transform: translate(0, 0); } 15% { transform: translate(-9px, 3px) skewX(6deg); }
      30% { transform: translate(7px, -4px); } 45% { transform: translate(-3px, 0) skewX(-8deg) scaleY(1.06); }
      60% { transform: translate(11px, 2px); } 75% { transform: translate(0, -6px) skewX(4deg); }
      90% { transform: translate(-6px, 1px); }
    }
    @keyframes sd-collapse {
      0% { transform: scale(1, 6); opacity: 1; } 40% { transform: scale(1, 1); opacity: 1; }
      100% { transform: scale(0, 1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .sd, .sd * { animation: none !important; } }

    /* ---------- карта камер (левый монитор) ---------- */
    .cam-map { position: absolute; inset: 0; }
    .cam-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .cam-svg .room { fill: none; stroke: #e8e8e8; stroke-width: 1.6; }
    .cam-svg .room--hall { stroke: #7a7a7a; stroke-width: 1; stroke-dasharray: 5 4; }
    .cam-svg .outline { fill: none; stroke: #e8e8e8; stroke-width: 1.6; }
    .cam-svg .door { fill: #040504; }
    .cam-svg .wc { fill: #8a8a8a; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .cam-svg .you-box { fill: #ececec; }
    .cam-svg .you-text { fill: #ececec; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cam-svg .room--hl { stroke: #ffd24a; stroke-width: 2.4; fill: rgba(255, 210, 74, 0.22); }
    .cam-svg .room--nb { fill: rgba(255, 210, 74, 0.12); }
    .cam-btn {
      position: absolute;
      z-index: 2;
      width: 62px;
      height: 46px;
      margin: -23px 0 0 -31px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      background: #000;
      color: #ececec;
      border: 2px solid #ececec;
      border-radius: 0;
      font: 700 22px / 1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      touch-action: manipulation;
    }
    .cam-btn small { font-size: 11px; font-weight: 700; line-height: 1; letter-spacing: 0.06em; }
    .cam-btn::after { content: ""; position: absolute; inset: -5px; }   /* увеличенная зона нажатия */
    .cam-btn:active, .cam-btn--active { background: #1f6f1f; border-color: #8dff8d; color: #fff; }
    .cam-btn--phantom { z-index: 3; color: #9dffc4; border-color: #9dffc4; opacity: 0.9; pointer-events: none; }
    .cam-btn--phantom[hidden] { display: none; }
    .cam-caption {
      position: absolute; z-index: 2; left: 18px; bottom: 12px; right: 18px;
      font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---------- вид камеры (левый монитор, этап 4) ---------- */
    .cam-map.is-hidden { display: none; }
    .cam-view { position: absolute; inset: 0; display: none; background: #000; }
    .cam-view.is-open { display: block; }
    .cam-frame { position: absolute; left: 0; top: 0; width: 501px; height: 376px; overflow: hidden; background: #000; }
    .cam-glitch-text { position: absolute; z-index: 4; left: 0; right: 0; top: 45%; color: #d7ffe8;
      text-align: center; font: 800 24px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.12em; text-shadow: 0 0 5px #55ff9a, 0 0 14px #55ff9a; transform: rotate(-1deg); pointer-events: none; }
    .cam-glitch-text[hidden] { display: none; }
    /* Один фильтр на фон и спрайты врагов: общий вид задаётся здесь */
    .cam-feed {
      position: absolute;
      inset: 0;
      /* --cam-b и --cam-c задаёт cameras.js: автояркость кадра и ручная подстройка из rooms.json */
      filter: grayscale(0.85) contrast(calc(1.15 * var(--cam-c, 1))) brightness(calc(1.1 * var(--cam-b, 1)))
        sepia(0.25) hue-rotate(70deg) saturate(0.9);
      animation: cam-flicker 9s linear infinite;
    }
    .cam-world { position: absolute; inset: 0; animation: cam-drift 18s ease-in-out infinite alternate; }
    @keyframes cam-drift {
      from { transform: scale(1.06) translateX(-2.2%); }
      to { transform: scale(1.06) translateX(2.2%); }
    }
    @keyframes cam-flicker {
      0%, 90%, 100% { opacity: 1; }
      91% { opacity: 0.8; }
      92% { opacity: 1; }
      95% { opacity: 0.9; }
      95.5% { opacity: 1; }
    }
    .cam-roll {                      /* светлая полоса, медленно ползёт сверху вниз, как сбой развёртки */
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 22%;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.06), transparent);
      pointer-events: none;
      animation: cam-roll 7s linear infinite;
    }
    @keyframes cam-roll { from { transform: translateY(-120%); } to { transform: translateY(520%); } }
    @media (prefers-reduced-motion: reduce) {
      .cam-feed, .cam-world, .cam-roll { animation: none; }
    }
    .cam-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
    .cam-sprites { position: absolute; inset: 0; }     /* спрайты врагов, координаты в % кадра */
    .cam-spr { position: absolute; inset: 0; pointer-events: none; }
    .cam-spr__shadow { position: absolute; height: 4%; transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7), transparent 70%); filter: blur(2px); }
    .cam-spr img { position: absolute; display: block; width: auto; max-width: none; transform-origin: 50% 100%;
      -webkit-user-select: none; user-select: none; }
    .cam-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      opacity: 0.08;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .cam-scan {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.65) 100%);
    }
    /* вспышка помех при переключении: 200 мс, снимается по animationend */
    .cam-frame.is-flash .cam-noise { animation: cam-flash 0.2s steps(5) 1; }
    .cam-frame.is-flash .cam-feed { animation: cam-feed-in 0.2s step-end 1; }
    @keyframes cam-flash { from { opacity: 0.95; } to { opacity: 0.08; } }
    @keyframes cam-feed-in { 0% { opacity: 0; } 50% { opacity: 1; } }
    /* сломанная камера */
    .cam-frame.is-broken .cam-feed { visibility: hidden; }
    .cam-frame.is-broken .cam-noise { opacity: 0.8; }
    .cam-error {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .cam-error[hidden] { display: none; }
    .cam-error__title {
      padding: 6px 12px;
      background: #000;
      color: #ff4040;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .cam-error__btn {
      min-width: 170px;
      height: 44px;
      padding: 0 14px;
      background: #000;
      color: #ececec;
      border: 2px solid #ececec;
      border-radius: 0;
      font: 700 16px / 1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      touch-action: manipulation;
    }
    .cam-error__btn::after { content: ""; position: absolute; inset: -4px; }
    .cam-error__btn { position: relative; }
    .cam-error__btn:active { background: #1f6f1f; border-color: #8dff8d; }
    .cam-error__btn:disabled { color: #777; border-color: #555; }
    /* HUD */
    .cam-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: #f2f2f2;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-shadow: 0 0 3px #000;
    }
    .cam-hud > * { position: absolute; }
    .hud-rec { left: 12px; top: 10px; display: flex; align-items: center; gap: 6px; }
    .hud-rec::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e02020;
      animation: cam-blink 1s step-end infinite;
    }
    @keyframes cam-blink { 50% { opacity: 0; } }
    .hud-time { right: 12px; top: 10px; }
    .hud-name { left: 12px; bottom: 10px; }
    .hud-stat { right: 12px; bottom: 10px; text-align: right; line-height: 1.3; }
    /* кнопка звонка-приманки (панель ИИ-агента), над названием камеры */
    .cam-call {
      position: absolute;
      left: 12px;
      bottom: 34px;
      z-index: 3;
      min-width: 130px;
      height: 40px;
      padding: 0 12px;
      background: #000;
      color: #ececec;
      border: 2px solid #ececec;
      border-radius: 0;
      font: 700 14px / 1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      touch-action: manipulation;
    }
    .cam-call-at {
      position: absolute; left: 12px; bottom: 80px; z-index: 3; max-width: 220px;
      font: 700 12px / 1.2 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      color: #cfcfcf; text-shadow: 0 0 3px #000, 0 0 6px #000; pointer-events: none;
    }
    .cam-call::after { content: ""; position: absolute; inset: -4px; }
    .cam-call:active { background: #1f6f1f; border-color: #8dff8d; }
    .cam-call:disabled { color: #777; border-color: #555; }
    .cam-call.is-active { color: #fff; border-color: #ff4040; background: #3a0000; }
    .hud-load { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .hud-load__label.is-over { color: #ff4040; animation: cam-blink 0.8s step-end infinite; }
    .hud-load__bar { display: flex; gap: 2px; }
    .hud-load__bar i { box-sizing: border-box; width: 12px; height: 10px; background: #1a1a1a; border: 1px solid #4a4a4a; }
    .hud-load__bar i.lv-g.is-lit { background: #2ecc40; border-color: #2ecc40; }
    .hud-load__bar i.lv-y.is-lit { background: #ffd21f; border-color: #ffd21f; }
    .hud-load__bar i.lv-r.is-lit { background: #ff3030; border-color: #ff3030; }
    /* колонка справа от кадра: камеры и «Карта» */
    .cam-side {
      position: absolute;
      left: 501px;
      top: 0;
      right: 0;
      bottom: 0;
      box-sizing: border-box;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #050605;
      border-left: 1px solid #333;
    }
    .cam-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .cam-sbtn, .cam-back {
      position: relative;
      box-sizing: border-box;
      height: 40px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      background: #000;
      color: #ececec;
      border: 2px solid #ececec;

    }
    .cam-sbtn small { font-size: 9px; line-height: 1; letter-spacing: 0.06em; }
    .cam-sbtn::after, .cam-back::after { content: ""; position: absolute; inset: -2px; }
    .cam-sbtn:active, .cam-sbtn--active, .cam-back:active { background: #1f6f1f; border-color: #8dff8d; color: #fff; }
    .cam-back { margin-top: auto; font-size: 14px; }

    /* ---------- Teams (правый монитор, этап 7) ---------- */
    .tm { position: absolute; inset: 0; display: flex; flex-direction: column; background: #1b1b28; color: #e6e6f0;
      font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .tm [hidden] { display: none !important; }
    .tm-top { flex: none; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
      background: #464eb8; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4); }
    .tm-logo { width: 24px; height: 24px; border-radius: 5px; background: #2b2f7a; display: grid; place-items: center;
      font-weight: 800; color: #fff; }
    .tm-title { font-weight: 700; letter-spacing: 0.02em; }
    .tm-overload { margin-left: 4px; padding: 3px 8px; border-radius: 4px; background: #5a0d0d; border: 1px solid #ff4040;
      color: #ff6b6b; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; animation: tm-blink 0.9s steps(2) infinite; }
    @keyframes tm-blink { 50% { opacity: 0.25; } }
    .tm-sla { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .tm-sla__label { opacity: 0.85; }
    .tm-sla__bar { width: 86px; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.45); overflow: hidden; }
    .tm-sla__bar i { display: block; height: 100%; width: 0; background: #3ecf6a; transition: width 0.3s; }
    .tm-sla__bar i.is-mid { background: #f0b840; }
    .tm-sla__bar i.is-bad { background: #ff4a4a; }
    .tm-sla__num { min-width: 24px; text-align: right; font-size: 14px; }
    .tm-body { flex: 1; display: flex; min-height: 0; }
    .tm-side { flex: none; width: 112px; background: #232336; padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
    .tm-tab { position: relative; height: 44px; padding: 0 12px; border: 0; background: transparent; color: #b8b8d0;
      font: inherit; text-align: left; cursor: pointer; border-left: 3px solid transparent; }
    .tm-tab.is-active { background: #2e2e48; color: #fff; border-left-color: #7b83eb; font-weight: 700; }
    .tm-dot { position: absolute; right: 10px; top: 16px; width: 9px; height: 9px; border-radius: 50%; background: #ff4a4a; }
    .tm-main { position: relative; flex: 1; min-width: 0; }
    .tm-feed { position: absolute; left: 0; right: 0; top: 0; bottom: 22px; display: flex; flex-direction: column;
      gap: 6px; padding: 8px 10px 4px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      scrollbar-width: thin; scrollbar-color: #464eb8 transparent; }
    /* прижимает сообщения к низу, но не мешает прокрутке (justify-content: flex-end съедал верх списка) */
    .tm-feed::before { content: ''; flex: none; margin-top: auto; margin-bottom: -6px; }
    .tm-empty { margin: auto; color: #77779a; font-size: 13px; }
    .tm-card, .tm-msg { flex: none; display: flex; gap: 9px; padding: 7px 10px; border-radius: 6px; background: #2a2a3f;
      border-left: 3px solid #7b83eb; }
    .tm-msg { background: #2b2127; border-left-color: #a33; }
    .tm-msg .tm-text { color: #f0c4c4; }
    .tm-card.is-done { opacity: 0.55; border-left-color: #3ecf6a; }
    .tm-card.is-missed { opacity: 0.75; border-left-color: #ff4a4a; }
    .tm-avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #5b5fc7; display: grid; place-items: center;
      font-weight: 700; color: #fff; }
    .tm-card__body { flex: 1; min-width: 0; }
    .tm-card__head { display: flex; justify-content: space-between; gap: 8px; }
    .tm-name { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tm-time { flex: none; color: #8a8aa8; font-size: 11px; }
    .tm-text { font-size: 13px; overflow-wrap: anywhere; }
    .tm-card__foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .tm-badge { flex: none; padding: 1px 7px; border-radius: 9px; background: #3a3a58; font-size: 10px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; }
    .tm-card.is-done .tm-badge { background: #1f5a33; color: #9ff0b6; }
    .tm-card.is-missed .tm-badge { background: #5a1f1f; color: #ff9a9a; }
    .tm-age { flex: 1; height: 4px; border-radius: 2px; background: #1b1b28; overflow: hidden; }
    .tm-age i { display: block; height: 100%; width: 0; background: #4a6cff; }
    .tm-age i.is-warm { background: #f0b840; }
    .tm-age i.is-hot { background: #ff4a4a; }
    .tm-typing { position: absolute; left: 12px; bottom: 3px; height: 18px; display: flex; align-items: center; gap: 6px;
      color: #8a8aa8; font-size: 11px; font-style: italic; }
    .tm-typing.is-fifth { color: #9dffc4; }
    .tm-typing.is-fifth .tm-dots i { background: #9dffc4; }
    .tm-toast { position: absolute; top: 6px; right: 8px; width: 210px; z-index: 5; display: flex; gap: 8px; padding: 8px 10px;
      background: #1f2a27; border: 1px solid #7dffb0; border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5); }
    .tm-toast .tm-avatar { background: #2f8f4e; }
    .tm-toast .tm-name { color: #c9ffe0; }
    .tm-toast .tm-text { color: #e8fff2; }
    .tm-ghost-call { position: absolute; z-index: 6; left: 50%; top: 40%; width: min(80%, 300px); transform: translate(-50%, -50%);
      padding: 14px 18px; border: 1px solid #d5ffe8; background: rgba(5, 15, 10, 0.94); color: #e7fff0;
      box-shadow: 0 0 18px rgba(100, 255, 170, 0.45); text-align: center; font-weight: 700; pointer-events: none; }
    .tm-ghost-call[hidden] { display: none; }
    .tm-dots { display: inline-flex; gap: 3px; }
    .tm-dots i { width: 4px; height: 4px; border-radius: 50%; background: #8a8aa8; animation: tm-dot 1s infinite; }
    .tm-dots i:nth-child(2) { animation-delay: 0.15s; }
    .tm-dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes tm-dot { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
    .tm-arch { position: absolute; inset: 0; padding: 8px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
      scrollbar-width: none; touch-action: pan-y; }
    .tm-arch::-webkit-scrollbar, .tm-chat__messages::-webkit-scrollbar { display: none; }
    .tm-arch__hint { flex: none; color: #77779a; font-size: 11px; }
    .tm-arch__item { flex: none; padding: 7px 10px; border-radius: 6px; background: #25253a; }
    .tm-arch__entry { flex: none; display: flex; flex-direction: column; gap: 5px; width: 100%; padding: 8px 10px; border: 0;
      border-radius: 6px; background: #25253a; color: #e8e8f2; font: inherit; text-align: left; cursor: pointer; }
    .tm-arch__entry:hover, .tm-arch__entry:focus-visible { background: #30304a; outline: 1px solid #7b83eb; }
    .tm-arch__entry-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .tm-arch__entry-head .tm-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tm-arch__preview { overflow: hidden; color: #a4a4bc; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .tm-arch__back { flex: none; align-self: flex-start; padding: 4px 8px; border: 0; border-radius: 4px; background: #343458;
      color: #e8e8f2; font: inherit; cursor: pointer; }
    .tm-arch__back:hover, .tm-arch__back:focus-visible { background: #464875; outline: 1px solid #7b83eb; }
    .tm-arch__detail-head { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 0; }
    .tm-arch__msg .tm-time { grid-column: 1; grid-row: 1 / span 2; }
    .tm-arch__msg .tm-name { grid-column: 2; grid-row: 1; font-size: 11px; opacity: 0.85; }
    .tm-arch__msg .tm-text { grid-column: 2; grid-row: 2; min-width: 0; }
    .tm-arch__head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .tm-arch__head .tm-time { margin-left: auto; }
    .tm-chip { padding: 1px 7px; border-radius: 9px; background: #343458; font-size: 10px; font-weight: 700; }
    .tm-arch__msg { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 6px; padding: 5px 0;
      border-bottom: 1px solid #303047; }
    .tm-arch__msg .tm-time { flex: none; width: 34px; }
    .tm-arch__msg .tm-name { flex: none; font-size: 11px; opacity: 0.85; }
    .tm-arch__msg .tm-text { min-width: 0; }
    .tm-arch__locked { flex: none; padding: 8px; text-align: center; color: #5c5c7a; font-size: 12px; border: 1px dashed #3a3a58;
      border-radius: 6px; }
    .tm-chats { position: absolute; inset: 0; padding: 8px 10px; }
    .tm-chat__contact .tm-avatar { flex: none; }
    .tm-chat { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
    .tm-chat__header { flex: none; display: flex; align-items: center; gap: 8px; }
    .tm-chat__header .tm-time { margin-left: auto; }
    .tm-chat__messages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
      overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none; }
    .tm-chat__entry { max-width: 90%; padding: 6px 9px; border-radius: 6px; background: #25253a; overflow-wrap: anywhere; }
    .tm-chat__entry.is-outgoing { align-self: flex-end; background: #343458; }
    .tm-chat__entry.is-call { align-self: center; width: 100%; max-width: 100%; text-align: center; background: #20202d; }
    .tm-chat__meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; font-size: 11px; }
    .tm-chat__composer { flex: none; display: flex; gap: 6px; padding-top: 3px; }
    .tm-chat__input { flex: 1; min-width: 0; height: 36px; padding: 0 9px; border: 1px solid #44445e; border-radius: 5px;
      background: #181824; color: #eee; font: inherit; }
    .tm-chat__send { min-width: 84px; height: 36px; }
    .tm-callbtn, .tm-hang { flex: none; min-width: 96px; height: 40px; border: 0; border-radius: 6px; font: inherit; font-weight: 700; color: #fff; }
    .tm-callbtn { background: #2f8f4e; }
    .tm-callbtn:disabled { background: #3a3a58; color: #8a8aa8; }
    .tm-hang { background: #c63a3a; }
    .tm-callbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; background: #14141f; border-top: 1px solid #3a3a58; }
    .tm-callbar__top { display: flex; align-items: center; gap: 9px; }
    .tm-callbar .tm-avatar { background: #2f8f4e; }
    .tm-callbar .tm-avatar.is-blank { position: relative; overflow: hidden; background: #6b6b78; }
    .tm-callbar .tm-avatar.is-blank::before { content: ''; position: absolute; left: 9px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #2a2a34; }
    .tm-callbar .tm-avatar.is-blank::after { content: ''; position: absolute; left: 4px; top: 16px; width: 20px; height: 14px; border-radius: 10px 10px 0 0; background: #2a2a34; }
    .tm-callbar .tm-callbtn, .tm-callbar .tm-hang { min-width: 84px; height: 40px; }
    .tm-callbar.is-ring .tm-avatar { animation: tm-ring 0.7s infinite alternate; }
    .tm-callbar__sub { margin-top: 5px; font-size: 13px; line-height: 1.3; color: #f2f2fa; display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden; }
    .tm-main.has-call .tm-feed { bottom: 56px; }
    .tm-main.has-call.is-story .tm-feed { bottom: 108px; }
    .tm-main.has-call .tm-typing { bottom: 56px; }
    .tm-main.has-call.is-story .tm-typing { bottom: 108px; }
    .tm-main.has-call .tm-chats, .tm-main.has-call .tm-arch { bottom: 56px; }
    .tm-main.has-call.is-story .tm-chats, .tm-main.has-call.is-story .tm-arch { bottom: 108px; }
    .tm-main.is-chat .tm-typing { bottom: 48px; }
    .tm-main.has-call.is-chat .tm-typing { bottom: 104px; }
    @keyframes tm-ring { from { transform: scale(1); } to { transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) { .tm-overload, .tm-dots i, .tm-callbar .tm-avatar { animation: none; } }

    /* кнопка починки на камере (внутри .cam-world, едет вместе с кадром) */
    .cam-fix { position: absolute; transform: translate(-50%, -50%); min-width: 74px; height: 30px; padding: 0 10px;
      border: 2px solid #fff; border-radius: 6px; background: rgba(0, 0, 0, 0.78); color: #fff; font: 700 11px/1 system-ui, sans-serif;
      letter-spacing: 0.04em; text-transform: uppercase; overflow: hidden; touch-action: none; cursor: pointer;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; animation: cam-fix-pulse 1.2s ease-in-out infinite; }
    .cam-fix::after { content: ""; position: absolute; inset: -14px; }   /* зона нажатия больше видимой рамки */
    .cam-fix span { position: relative; z-index: 1; }
    .cam-fix i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #2fae4e; }
    .cam-fix.is-hold { animation: none; border-color: #8dff8d; }
    @keyframes cam-fix-pulse { 50% { border-color: #ffd34a; } }
    @media (prefers-reduced-motion: reduce) { .cam-fix { animation: none; } }

    /* ---------- скример ---------- */
    .scare { position: absolute; inset: 0; z-index: 8; background: #000; overflow: hidden; pointer-events: auto; }
    .scare[hidden] { display: none; }
    .scare-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .scare-noise { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated;
      mix-blend-mode: overlay; opacity: 0; pointer-events: none; }
    .scare-tint { position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px); }
    .scare[data-phase="black"] .scare-tint, .scare[data-phase="flash"] .scare-tint { display: none; }

    /* ---------- стартовый экран ---------- */
    .start-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background: rgba(0, 0, 0, 0.88);
      text-align: center;
      padding: 1rem;
    }
    .start-screen[hidden] { display: none; }
    .start-title { margin: 0; font-size: clamp(1.6rem, 6vw, 3rem); letter-spacing: 0.08em; }
    .start-hint { margin: 0; font-size: 1rem; opacity: 0.7; }
    .start-btn {
      min-width: 12rem;
      min-height: 3.5rem;
      padding: 0.6rem 1.6rem;
      font: inherit;
      font-size: 1.25rem;
      color: #d8e6d8;
      background: #101810;
      border: 2px solid #3a5a3a;
      border-radius: 0.4rem;
      touch-action: manipulation;
    }
    .start-btn:active { background: #1d2d1d; }
    .start-btn--ghost { min-height: 2.8rem; font-size: 1rem; background: transparent; border-color: #2a3a2a; opacity: 0.85; }
    .start-btn[hidden] { display: none; }
    .start-hint--small { font-size: 0.85rem; max-width: 28rem; }

    /* ---------- подсказка «поверни устройство» ---------- */
    .rotate-hint {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #000;
      text-align: center;
      font-size: 1.25rem;
    }
    @media (orientation: portrait) {
      .rotate-hint { display: flex; }
    }
  </style>
