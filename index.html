<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Конторка">
  <title>Конторка</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #d8e6d8;
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    :root { --noise: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxODAnIGhlaWdodD0nMTgwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjxmZUNvbG9yTWF0cml4IHR5cGU9J3NhdHVyYXRlJyB2YWx1ZXM9JzAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4="); }
    #app { position: fixed; inset: 0; overflow: hidden; }

    /* Размытая копия фото на весь экран: заполняет поля, если окно шире кадра */
    .backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(18px) brightness(0.55);
      transform: scale(1.1);
      pointer-events: none;
    }

    /* ---------- сцена 16:9, все слои в процентах ---------- */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      /* Кадр 16:9 занимает всю ширину окна. Если окно шире, лишнее обрезается
         сверху и снизу, но не больше ~9% высоты (195 вместо 177.78). */
      width: min(100vw, 195vh);
      width: min(100vw, 195dvh);
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      container-type: inline-size;
      background: #000;
    }
    .desk-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    .layer { position: absolute; box-sizing: border-box; }
    .desk-photo { filter: saturate(0.8) contrast(1.1) brightness(0.92); }

    /* ---------- атмосфера стола: слои поверх фото, координаты в % сцены ---------- */
    .fx { position: absolute; pointer-events: none; }
    .fx-grade { inset: 0; background: rgba(8, 34, 30, 0.34); mix-blend-mode: color; }
    .fx-window {
      left: 0; top: 0; width: 13%; height: 38%;
      overflow: hidden;
      background: linear-gradient(100deg, rgba(70, 120, 255, 0.30), transparent 85%);
      mix-blend-mode: screen;
      animation: fx-window 13s linear infinite;
    }
    .fx-window__pass {
      position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.85), transparent);
      animation: fx-pass 17s linear infinite;
    }
    @keyframes fx-window {
      0%, 100% { opacity: 0.85; } 40% { opacity: 1; } 41% { opacity: 0.35; } 42% { opacity: 1; } 70% { opacity: 0.7; }
    }
    @keyframes fx-pass {
      0%, 88% { transform: translateX(-130%); } 100% { transform: translateX(260%); }
    }
    .fx-spill {
      --spill: 0.5;
      left: 18%; top: 70%; width: 64%; height: 30%;
      background: radial-gradient(ellipse at 50% 0%, rgba(120, 255, 170, 0.2), transparent 70%);
      mix-blend-mode: screen;
      animation: fx-spill 6s linear infinite;
    }
    .stage.is-cam .fx-spill { --spill: 1; }
    @keyframes fx-spill {
      0%, 100% { opacity: var(--spill); }
      30% { opacity: calc(var(--spill) * 0.75); }
      32% { opacity: var(--spill); }
      66% { opacity: calc(var(--spill) * 0.85); }
    }
    .fx-vignette {
      inset: 0;
      background: radial-gradient(ellipse at 50% 45%, transparent 36%, rgba(0, 0, 0, calc(0.5 + 0.4 * var(--tension, 0))) 100%);
      animation: fx-breathe 9s ease-in-out infinite alternate;
    }
    @keyframes fx-breathe { from { opacity: 0.8; } to { opacity: 1; } }
    .fx-led {                                   /* индикатор веб-камеры над мониторами */
      left: 51.44%; top: 12.43%;
      width: 0.5cqw; height: 0.5cqw; margin: -0.25cqw 0 0 -0.25cqw;
      border-radius: 50%;
      background: #ff2a2a;
      box-shadow: 0 0 0.8cqw 0.25cqw rgba(255, 40, 40, 0.65);
      animation: fx-led 3.4s ease-in-out infinite;
    }
    @keyframes fx-led { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .fx-grain {
      inset: -10%;
      background-image: var(--noise);
      opacity: 0.06;
      mix-blend-mode: screen;
      animation: fx-grain 0.9s steps(6) infinite;
    }
    @keyframes fx-grain {
      0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); } 40% { transform: translate(2%, -3%); }
      60% { transform: translate(-2%, -1%); } 80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fx, .fx-window__pass { animation: none; }
    }

    /* Часы Sony: SVG в координатах фото (1672x941), цифры рисуются сегментами */
    .clock-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .clock-svg .seg { fill: #14b014; }

    /* ---------- мониторы ----------
       Каждый монитор это холст 640x376 px, который JS (desk.js) растягивает матрицей
       matrix3d на четырёхугольник экрана с фото. Внутри холста всё в обычных px. */
    .mon {
      position: absolute;
      left: 0;
      top: 0;
      width: 640px;
      height: 376px;
      transform-origin: 0 0;
      overflow: hidden;
      background: #040504;
      color: #ececec;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      visibility: hidden;            /* показывается после расчёта перспективы */
    }
    .mon.is-ready { visibility: visible; }
    .mon::before {                   /* статический шум, как на мониторах охраны */
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      background-image: var(--noise);
      opacity: 0.12;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .mon::after {                    /* строки развёртки и виньетка */
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
    }
    .glitch-silhouette { position: absolute; inset: 0; z-index: 7; overflow: hidden; pointer-events: none;
      background: radial-gradient(ellipse at 50% 77%, rgba(0, 0, 0, 0.94) 0 15%, transparent 16%);
      animation: glitch-silhouette 0.12s steps(2) infinite; }
    .glitch-silhouette[hidden] { display: none; }
    .glitch-silhouette span { position: absolute; left: 44%; top: 17%; width: 12%; height: 25%; border-radius: 50%;
      background: #020302; box-shadow: 0 18px 22px 10px #020302; }
    @keyframes glitch-silhouette { 50% { opacity: 0.65; transform: translateX(2px); } }
    @media (prefers-reduced-motion: reduce) { .glitch-silhouette { animation: none; } }

    /* ---------- отключение при 0% токенов (оверлей внутри каждого монитора) ---------- */
    .sd { position: absolute; inset: 0; z-index: 4; background: #000; pointer-events: auto; overflow: hidden;
      display: flex; align-items: center; justify-content: center; }
    .sd[hidden] { display: none; }
    .sd > * { display: none; }
    .sd[data-phase="error"], .sd[data-phase="glitch"] { background: #0b0202; }
    .sd[data-phase="glitch"] { animation: sd-flick 0.2s steps(1) infinite; }
    .sd[data-phase="error"] .sd-err, .sd[data-phase="glitch"] .sd-err { display: block; }
    .sd-err { width: 440px; box-sizing: border-box; padding: 18px 22px; border: 2px solid #ff4040; background: #120404; }
    .sd[data-phase="error"] .sd-err { animation: sd-in 0.4s steps(4) 1; }
    .sd[data-phase="glitch"] .sd-err { animation: sd-shake 0.3s steps(1) infinite;
      text-shadow: 2px 0 #00e5ff, -2px 0 #ff0030; }
    .sd-err__title { color: #ff4040; font-size: 18px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 10px; }
    .sd-err__text { color: #ececec; font-size: 14px; line-height: 1.4; }
    .sd-err__code { color: #888; font-size: 12px; margin-top: 12px; }
    .sd[data-phase="off"] .sd-line { display: block; position: absolute; left: 0; right: 0; top: 50%; height: 3px;
      margin-top: -1.5px; background: #fff; box-shadow: 0 0 12px 3px rgba(190, 255, 200, 0.8);
      animation: sd-collapse 0.6s ease-in forwards; }
    .sd[data-phase="boot"] .sd-boot, .sd[data-phase="fail"] .sd-boot { display: block; width: 320px; text-align: center; }
    .sd-boot__title { color: #ececec; font-size: 16px; letter-spacing: 0.06em; margin-bottom: 14px; }
    .sd-bar { height: 14px; box-sizing: border-box; border: 2px solid #ececec; padding: 2px; }
    .sd-bar i { display: block; height: 100%; width: 0; background: #ececec; }
    .sd[data-phase="fail"] .sd-bar { border-color: #ff4040; }
    .sd[data-phase="fail"] .sd-bar i { background: #ff3030; }
    .sd-boot__fail { display: none; color: #ff4040; font-size: 14px; font-weight: 700; margin-top: 14px; }
    .sd[data-phase="fail"] .sd-boot__fail { display: block; }
    .mon.is-dead::before, .mon.is-dead::after { display: none; }
    .stage.is-dark .fx-spill { animation: none; opacity: 0; transition: opacity 1.5s; }
    .stage.is-dark .desk-photo { filter: saturate(0.7) contrast(1.1) brightness(0.6); transition: filter 2s; }
    @keyframes sd-in { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0.3; } 100% { opacity: 1; } }
    @keyframes sd-flick {
      0% { background: #0b0202; } 20% { background: #3a0000; } 40% { background: #000; }
      55% { background: #0b0202; } 70% { background: #1a1a1a; } 85% { background: #000; }
    }
    @keyframes sd-shake {
      0% { transform: translate(0, 0); } 15% { transform: translate(-9px, 3px) skewX(6deg); }
      30% { transform: translate(7px, -4px); } 45% { transform: translate(-3px, 0) skewX(-8deg) scaleY(1.06); }
      60% { transform: translate(11px, 2px); } 75% { transform: translate(0, -6px) skewX(4deg); }
      90% { transform: translate(-6px, 1px); }
    }
    @keyframes sd-collapse {
      0% { transform: scale(1, 6); opacity: 1; } 40% { transform: scale(1, 1); opacity: 1; }
      100% { transform: scale(0, 1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .sd, .sd * { animation: none !important; } }

    /* ---------- карта камер (левый монитор) ---------- */
    .cam-map { position: absolute; inset: 0; }
    .cam-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .cam-svg .room { fill: none; stroke: #e8e8e8; stroke-width: 1.6; }
    .cam-svg .room--hall { stroke: #7a7a7a; stroke-width: 1; stroke-dasharray: 5 4; }
    .cam-svg .outline { fill: none; stroke: #e8e8e8; stroke-width: 1.6; }
    .cam-svg .door { fill: #040504; }
    .cam-svg .wc { fill: #8a8a8a; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .cam-svg .you-box { fill: #ececec; }
    .cam-svg .you-text { fill: #ececec; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .cam-svg .room--hl { stroke: #ffd24a; stroke-width: 2.4; fill: rgba(255, 210, 74, 0.22); }
    .cam-svg .room--nb { fill: rgba(255, 210, 74, 0.12); }
    .cam-btn {
      position: absolute;
      z-index: 2;
      width: 62px;
      height: 46px;
      margin: -23px 0 0 -31px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      background: #000;
      color: #ececec;
      border: 2px solid #ececec;
      border-radius: 0;
      font: 700 22px / 1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      touch-action: manipulation;
    }
    .cam-btn small { font-size: 11px; font-weight: 700; line-height: 1; letter-spacing: 0.06em; }
    .cam-btn::after { content: ""; position: absolute; inset: -5px; }   /* увеличенная зона нажатия */
    .cam-btn:active, .cam-btn--active { background: #1f6f1f; border-color: #8dff8d; color: #fff; }
    .cam-btn--phantom { z-index: 3; color: #9dffc4; border-color: #9dffc4; opacity: 0.9; pointer-events: none; }
    .cam-btn--phantom[hidden] { display: none; }
    .cam-caption {
      position: absolute; z-index: 2; left: 18px; bottom: 12px; right: 18px;
      font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---------- вид камеры (левый монитор, этап 4) ---------- */
    .cam-map.is-hidden { display: none; }
    .cam-view { position: absolute; inset: 0; display: none; background: #000; }
    .cam-view.is-open { display: block; }
    .cam-frame { position: absolute; left: 0; top: 0; width: 501px; height: 376px; overflow: hidden; background: #000; }
    .cam-glitch-text { position: absolute; z-index: 4; left: 0; right: 0; top: 45%; color: #d7ffe8;
      text-align: center; font: 800 24px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.12em; text-shadow: 0 0 5px #55ff9a, 0 0 14px #55ff9a; transform: rotate(-1deg); pointer-events: none; }
    .cam-glitch-text[hidden] { display: none; }
    /* Один фильтр на фон и спрайты врагов: общий вид задаётся здесь */
    .cam-feed {
      position: absolute;
      inset: 0;
      /* --cam-b и --cam-c задаёт cameras.js: автояркость кадра и ручная подстройка из rooms.json */
      filter: grayscale(0.85) contrast(calc(1.15 * var(--cam-c, 1))) brightness(calc(1.1 * var(--cam-b, 1)))
        sepia(0.25) hue-rotate(70deg) saturate(0.9);
      animation: cam-flicker 9s linear infinite;
    }
    .cam-world { position: absolute; inset: 0; animation: cam-drift 18s ease-in-out infinite alternate; }
    @keyframes cam-drift {
      from { transform: scale(1.06) translateX(-2.2%); }
      to { transform: scale(1.06) translateX(2.2%); }
    }
    @keyframes cam-flicker {
      0%, 90%, 100% { opacity: 1; }
      91% { opacity: 0.8; }
      92% { opacity: 1; }
      95% { opacity: 0.9; }
      95.5% { opacity: 1; }
    }
    .cam-roll {                      /* светлая полоса, медленно ползёт сверху вниз, как сбой развёртки */
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 22%;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.06), transparent);
      pointer-events: none;
      animation: cam-roll 7s linear infinite;
    }
    @keyframes cam-roll { from { transform: translateY(-120%); } to { transform: translateY(520%); } }
    @media (prefers-reduced-motion: reduce) {
      .cam-feed, .cam-world, .cam-roll { animation: none; }
    }
    .cam-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
    .cam-sprites { position: absolute; inset: 0; }     /* спрайты врагов, координаты в % кадра */
    .cam-spr { position: absolute; inset: 0; pointer-events: none; }
    .cam-spr__shadow { position: absolute; height: 4%; transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7), transparent 70%); filter: blur(2px); }
    .cam-spr img { position: absolute; display: block; width: auto; max-width: none; transform-origin: 50% 100%;
      -webkit-user-select: none; user-select: none; }
    .cam-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      opacity: 0.08;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .cam-scan {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.65) 100%);
    }
    /* вспышка помех при переключении: 200 мс, снимается по animationend */
    .cam-frame.is-flash .cam-noise { animation: cam-flash 0.2s steps(5) 1; }
    .cam-frame.is-flash .cam-feed { animation: cam-feed-in 0.2s step-end 1; }
    @keyframes cam-flash { from { opacity: 0.95; } to { opacity: 0.08; } }
    @keyframes cam-feed-in { 0% { opacity: 0; } 50% { opacity: 1; } }
    /* сломанная камера */
    .cam-frame.is-broken .cam-feed { visibility: hidden; }
    .cam-frame.is-broken .cam-noise { opacity: 0.8; }
    .cam-error {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .cam-error[hidden] { display: none; }
    .cam-error__title {
      padding: 6px 12px;
      background: #000;
      color: #ff4040;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .cam-error__btn {
      min-width: 170px;
      height: 44px;
      padding: 0 14px;
      background: #000;
      color: #ececec;
      border: 2px solid #ececec;
      border-radius: 0;
      font: 700 16px / 1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      touch-action: manipulation;
    }
    .cam-error__btn::after { content: ""; position: absolute; inset: -4px; }
    .cam-error__btn { position: relative; }
    .cam-error__btn:active { background: #1f6f1f; border-color: #8dff8d; }
    .cam-error__btn:disabled { color: #777; border-color: #555; }
    /* HUD */
    .cam-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: #f2f2f2;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-shadow: 0 0 3px #000;
    }
    .cam-hud > * { position: absolute; }
    .hud-rec { left: 12px; top: 10px; display: flex; align-items: center; gap: 6px; }
    .hud-rec::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e02020;
      animation: cam-blink 1s step-end infinite;
    }
    @keyframes cam-blink { 50% { opacity: 0; } }
    .hud-time { right: 12px; top: 10px; }
    .hud-name { left: 12px; bottom: 10px; }
    .hud-stat { right: 12px; bottom: 10px; text-align: right; line-height: 1.3; }
    /* кнопка звонка-приманки (панель ИИ-агента), над названием камеры */
    .cam-call {
      position: absolute;
      left: 12px;
      bottom: 34px;
      z-index: 3;
      min-width: 130px;
      height: 40px;
      padding: 0 12px;
      background: #000;
      color: #ececec;
      border: 2px solid #ececec;
      border-radius: 0;
      font: 700 14px / 1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      touch-action: manipulation;
    }
    .cam-call-at {
      position: absolute; left: 12px; bottom: 80px; z-index: 3; max-width: 220px;
      font: 700 12px / 1.2 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      color: #cfcfcf; text-shadow: 0 0 3px #000, 0 0 6px #000; pointer-events: none;
    }
    .cam-call::after { content: ""; position: absolute; inset: -4px; }
    .cam-call:active { background: #1f6f1f; border-color: #8dff8d; }
    .cam-call:disabled { color: #777; border-color: #555; }
    .cam-call.is-active { color: #fff; border-color: #ff4040; background: #3a0000; }
    .hud-load { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .hud-load__label.is-over { color: #ff4040; animation: cam-blink 0.8s step-end infinite; }
    .hud-load__bar { display: flex; gap: 2px; }
    .hud-load__bar i { box-sizing: border-box; width: 12px; height: 10px; background: #1a1a1a; border: 1px solid #4a4a4a; }
    .hud-load__bar i.lv-g.is-lit { background: #2ecc40; border-color: #2ecc40; }
    .hud-load__bar i.lv-y.is-lit { background: #ffd21f; border-color: #ffd21f; }
    .hud-load__bar i.lv-r.is-lit { background: #ff3030; border-color: #ff3030; }
    /* колонка справа от кадра: камеры и «Карта» */
    .cam-side {
      position: absolute;
      left: 501px;
      top: 0;
      right: 0;
      bottom: 0;
      box-sizing: border-box;

    .pause-background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%;
      opacity: 0.32; filter: saturate(0.72) contrast(1.05); }
    .pause-effects { position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(230,240,234,0.035) 4px),
        linear-gradient(90deg, rgba(0,0,0,0.62), rgba(0,0,0,0.26) 55%, rgba(0,0,0,0.12)); }
    .pause-panel { position: absolute; left: clamp(24px, 6.2vw, 112px); top: 17vh; width: clamp(260px, 34vw, 470px); }
    .pause-title { font-size: clamp(2.3rem, 4.5vw, 4rem); }
    @media (prefers-reduced-motion: reduce) {

    }

    /* ---------- подсказка «поверни устройство» ---------- */
    .rotate-hint {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #000;
      text-align: center;
      font-size: 1.25rem;
    }
    .mg-screen { --mg-accent: #8b8cf5; position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 1rem;
      box-sizing: border-box; background: radial-gradient(ellipse at center, rgba(27, 29, 47, 0.94), rgba(0, 0, 0, 0.98));
      color: #ececf4; }
    .mg-screen[hidden] { display: none; }
    .mg-panel { width: min(96vw, 1080px); height: min(88vh, 700px); min-height: 410px; overflow: hidden; box-sizing: border-box;
      border: 1px solid #55556c; border-radius: 12px; background: #1c1c2a;
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.78), 0 0 44px rgba(90, 92, 175, 0.16); animation: mg-arrive 0.42s cubic-bezier(.2,.8,.2,1) both; }
    .mg-topbar { height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 18px;
      background: #29293b; border-bottom: 1px solid #38384e; }
    .mg-brand { display: flex; align-items: center; gap: 9px; font-size: 0.92rem; font-weight: 750; letter-spacing: 0.02em; }
    .mg-brand-mark { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 6px; background: #6264a7; color: white; }
    .mg-header-status { margin-left: auto; color: #a9a9bd; font-size: 0.78rem; }
    .mg-header-status::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #8cceaa; }
    .mg-workspace { display: grid; grid-template-columns: minmax(210px, 28%) minmax(0, 1fr); height: calc(100% - 52px); }
    .mg-sidebar { min-height: 0; display: flex; flex-direction: column; background: #222232; border-right: 1px solid #38384e; }
    .mg-queue-heading { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 15px 11px;
      color: #d5d5e1; font-size: 0.88rem; }
    .mg-queue-count { color: #a6a6ba; font-size: 0.75rem; font-variant-numeric: tabular-nums; }
    .mg-queue { min-height: 0; overflow-y: auto; padding: 3px 8px 10px; }
    .mg-queue::-webkit-scrollbar { width: 7px; height: 7px; }
    .mg-queue::-webkit-scrollbar-thumb { border-radius: 6px; background: #505068; }
    .mg-queue::-webkit-scrollbar-track { background: transparent; }
    .mg-queue-item { position: relative; display: grid; grid-template-columns: 25px minmax(0, 1fr); align-items: center; gap: 8px;
      min-height: 56px; padding: 7px 8px; border-radius: 7px; color: #a7a7b9; }
    .mg-queue-item.is-active { color: #f0efff; background: #36364d; box-shadow: inset 3px 0 var(--mg-accent); animation: mg-highlight 0.4s ease-out both; }
    .mg-queue-item.is-done { opacity: 0.62; }
    .mg-queue-icon { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid #55556a; border-radius: 50%;
      color: #a9a9bd; font-size: 0.69rem; }
    .mg-queue-item.is-active .mg-queue-icon { border-color: var(--mg-accent); color: var(--mg-accent); }
    .mg-queue-item.is-done .mg-queue-icon { border-color: #609478; color: #8cceaa; }
    .mg-queue-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .mg-queue-name { overflow: hidden; color: inherit; font-size: 0.78rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .mg-queue-preview { overflow: hidden; color: #9999ae; font-size: 0.69rem; text-overflow: ellipsis; white-space: nowrap; }
    .mg-queue-state { grid-column: 2; color: #8f8fa5; font-size: 0.64rem; }
    .mg-request { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; padding: clamp(16px, 3vw, 34px); }
    .mg-request-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .mg-title { margin: 0; color: #f0efff; font-size: clamp(1.2rem, 2.5vw, 1.75rem); line-height: 1.25; }
    .mg-timer-label { flex: none; margin: 3px 0 0; color: #b5b5c8; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .mg-timer { flex: none; height: 4px; margin: 16px 0 18px; overflow: hidden; border-radius: 4px; background: #3a394c; }
    .mg-timer i { display: block; width: 100%; height: 100%; border-radius: inherit; background: #d2b667; transform-origin: left center;
      transition: transform 0.08s linear, background-color 0.2s ease; }
    .mg-timer i[data-urgency="warning"] { background: #e79c54; }
    .mg-timer i[data-urgency="urgent"] { background: #ef656a; }
    .mg-content { flex: 1; min-height: 120px; }
    .mg-request-meta { display: flex; align-items: center; gap: 11px; }
    .mg-sender-avatar { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
      background: #55599a; color: white; font-size: 1.05rem; font-weight: 750; }
    .mg-sender-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .mg-sender-name { overflow: hidden; color: #ecebf5; font-size: 0.85rem; text-overflow: ellipsis; white-space: nowrap; }
    .mg-sender-role { color: #a5a5b8; font-size: 0.72rem; }
    .mg-request-counter { margin-left: auto; color: #a5a5b8; font-size: 0.72rem; white-space: nowrap; }
    .mg-prompt { margin: clamp(20px, 4vh, 38px) 0 22px; color: #f3f1fa; font-size: clamp(1.05rem, 2.3vw, 1.42rem); line-height: 1.55; }
    .mg-request-detail { padding: 13px 15px; border: 1px solid #3c3b50; border-left: 3px solid var(--mg-accent); border-radius: 5px;
      background: rgba(255, 255, 255, 0.025); }
    .mg-detail-label { color: #b2b1c6; font-size: 0.7rem; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
    .mg-detail-copy { margin: 6px 0 0; color: #c5c4d2; font-size: 0.82rem; line-height: 1.5; }
    .mg-actions { flex: none; display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    .mg-button { flex: 1 1 210px; min-height: 48px; padding: 0.7rem 1rem; border: 1px solid #5b5b78; border-radius: 6px;
      background: #303044; color: #ededf6; font: inherit; font-size: 0.86rem; font-weight: 650; text-align: left; touch-action: manipulation; }
    .mg-button[data-choice="approve"], .mg-button[data-choice="grant"], .mg-button[data-choice="publish"] { border-color: #795a64; }
    .mg-button:hover:not(:disabled), .mg-button:focus-visible { border-color: var(--mg-accent); background: #3a3a54; outline: none; }
    .mg-button:active:not(:disabled) { transform: translateY(1px); }
    .mg-button:disabled { opacity: 0.52; }
    .mg-feedback { flex: none; min-height: 1.5em; margin: 12px 0 0; color: #c3c2d1; font-size: 0.8rem; }
    .mg-feedback[data-outcome="correct"] { color: #8cceaa; }
    .mg-feedback[data-outcome="incorrect"] { color: #e7a0a0; }
    .mg-feedback[data-outcome="neutral"] { color: #c9c4a6; }
    .mg-content.is-summary, .mg-content.is-complete, .mg-content.is-ending { display: flex; flex-direction: column; justify-content: center; }
    .mg-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 15px 0 20px; }
    .mg-stat { display: flex; flex-direction: column; gap: 5px; padding: 12px 9px; border: 1px solid #3c3b50; border-radius: 6px; background: #242434; }
    .mg-stat-value { color: #f0efff; font-size: 1.18rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .mg-stat-label { color: #a5a5b8; font-size: 0.67rem; }
    .mg-copy { margin: 10px 0; color: #c4c3d1; line-height: 1.55; }
    .mg-screen.is-corrupted { --mg-accent: #c7889d; }
    .mg-screen.is-corrupted .mg-panel { animation: mg-arrive 0.42s cubic-bezier(.2,.8,.2,1) both, mg-flicker 8s steps(1, end) 0.8s infinite; }
    .mg-screen[data-night="5"] { --mg-accent: #e47e82; }
    .mg-screen[data-night="5"] .mg-brand-mark { background: #8e3d4c; }
    .mg-screen[data-night="5"] .mg-topbar { background: #30242e; }
    @keyframes mg-arrive { from { opacity: 0; transform: translateY(12px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes mg-highlight { from { background: rgba(115, 115, 180, 0.12); } to { background: #36364d; } }
    @keyframes mg-flicker { 0%, 96%, 100% { filter: none; } 96.2% { filter: brightness(1.22) hue-rotate(-8deg); } 96.5% { filter: none; } }
    @media (max-width: 620px) {
      .mg-screen { padding: 0.45rem; }
      .mg-panel { width: 100%; height: min(94vh, 760px); min-height: 0; border-radius: 8px; }
      .mg-topbar { height: 44px; padding: 0 12px; }
      .mg-workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: calc(100% - 44px); }
      .mg-sidebar { max-height: 128px; border-right: 0; border-bottom: 1px solid #38384e; }
      .mg-queue-heading { padding: 8px 11px 5px; }
      .mg-queue { display: flex; gap: 5px; overflow-x: auto; overflow-y: hidden; padding: 2px 8px 8px; }
      .mg-queue-item { flex: 0 0 190px; min-height: 50px; padding: 4px 7px; }
      .mg-queue-state { display: none; }
      .mg-request { padding: 16px 14px; }
      .mg-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mg-stat { padding: 8px; }
      .mg-prompt { margin: 18px 0; }
    }
    @media (max-height: 520px) and (min-width: 621px) {
      .mg-panel { height: 96vh; min-height: 0; }
      .mg-request { padding-top: 14px; padding-bottom: 12px; }
      .mg-timer { margin: 10px 0; }
      .mg-prompt { margin: 14px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mg-panel, .mg-queue-item.is-active { animation: none !important; }
      .mg-timer i { transition: none; }
    }
    @media (orientation: portrait) {
      .rotate-hint { display: flex; }
    }
  </style>
